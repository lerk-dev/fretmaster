name: Deploy to EdgeOne Pages

# EdgeOne Pages 部署（腾讯云）。2026-10-04 修复两处死配置：
#   - node 18 → 22：Next 16 不支持 node 18，构建必失败
#   - build-dir ./dist → ./out：Next `output: export` 产物目录是 out/，dist 从不存在
# 触发分支收敛为 [main]（master 分支已停用，落后 main 268 个提交）。
# ⚠️ 部署前置条件：仓库 Settings → Secrets → Actions 配置 EO_ZONE_ID / EO_API_TOKEN
#    （EdgeOne Pages 控制台获取）。未配置时 Install/Build 照常跑通，仅 Deploy
#    步骤自动跳过，不会把流水线变红。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EO_ZONE_ID: ${{ secrets.EO_ZONE_ID }}
      EO_API_TOKEN: ${{ secrets.EO_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to EdgeOne Pages
        if: ${{ env.EO_API_TOKEN != '' }}
        uses: TencentCloud/edgeone-pages-action@main
        with:
          zone-id: ${{ env.EO_ZONE_ID }}
          api-token: ${{ env.EO_API_TOKEN }}
          build-dir: ./out
